version = 1

# Files without an SPDX header take the licence below; files with a header keep theirs.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Iain Chesworth"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Bundled typefaces. Their licence texts are in the same directory.
[[annotations]]
path = ["src/app/resources/fonts/IBMPlexMono-*.ttf", "src/app/resources/fonts/IBMPlexMono-OFL.txt", "src/app/resources/fonts/IBMPlexSans-*.ttf", "src/app/resources/fonts/IBMPlexSans-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/app/resources/fonts/NotoSansArabic.ttf", "src/app/resources/fonts/NotoSansArabic-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/arabic)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/app/resources/fonts/NotoSansHebrew.ttf", "src/app/resources/fonts/NotoSansHebrew-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/hebrew)"
SPDX-License-Identifier = "OFL-1.1"

# The word lists keep the project's licence. Where each came from, and what is still to be
# reviewed about the English one, is in src/app/resources/dictionary/README.md.
[[annotations]]
path = ["src/app/resources/dictionary/*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Iain Chesworth"
SPDX-License-Identifier = "GPL-3.0-or-later"
