version: 2
updates:
  # Keep GitHub Actions used in workflows up to date (including runtime
  # bumps like the Node 20 -> Node 24 migration across actions/* and
  # github/codeql-action). Grouped into a single weekly PR to cut noise.
  - package-ecosystem: "github-actions"
    directory: "/"
    # Gitflow only allows release/hotfix/support branches (or develop
    # itself) to target main -- point Dependabot at develop so its PRs land
    # where feature/bugfix work does.
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # Wait a week after a new action version is published before opening a
    # PR for it -- gives the community time to catch a compromised release
    # before this repo auto-updates to it.
    cooldown:
      default-days: 7
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns:
          - "*"

  # The vcpkg baseline moves monthly and is reviewed by hand. The policy job's
  # "vcpkg baseline in fork" check fails the pull request until the organisation's
  # fork has the commit.
  - package-ecosystem: "vcpkg"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    rebase-strategy: disabled

  # The pinned Python tools of CI and the docs build. Each requirements.txt is
  # compiled with hashes from its requirements.in (pip-compile).
  - package-ecosystem: "pip"
    directory: "/ci"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    rebase-strategy: disabled

  - package-ecosystem: "pip"
    directory: "/docs"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    rebase-strategy: disabled

  - package-ecosystem: "pip"
    directory: "/.clusterfuzzlite"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    rebase-strategy: disabled
