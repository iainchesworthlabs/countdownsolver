name: CodeQL

# Code scanning, nightly and by hand. It has no pull request trigger, so a finding never
# blocks a merge. A failed analysis opens or updates one `nightly-analysis` issue.
#
# C++ is built from the library and tests (the `linux-gcc-codeql` preset: no Qt app, and no
# sanitizers, because CodeQL's build tracer sets an LD_PRELOAD that collides with ASan and
# breaks the test discovery that runs the freshly linked binary).

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    name: CodeQL
    permissions:
      security-events: write
      contents: read
      issues: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/codeql.yml@e15f14812b7446517252d6677abf755698d57986 # v0.1.18
    with:
      runner: '["ubuntu-26.04"]'
      languages: >-
        [
          {"language": "cpp", "build_mode": "manual", "preset": "linux-gcc-codeql", "vcpkg": true, "skip_qt": true},
          {"language": "python", "build_mode": "none"},
          {"language": "actions", "build_mode": "none"}
        ]
